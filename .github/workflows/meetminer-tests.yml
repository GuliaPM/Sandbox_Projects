# Optional: runs the unit tests for meetminer/ on every push or pull request that touches it.
# Copy this file to .github/workflows/ at the root of the repository. It has not been run on GitHub yet.
name: meetminer tests

on:
  push:
    paths: ["meetminer/**"]
  pull_request:
    paths: ["meetminer/**"]

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: meetminer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
