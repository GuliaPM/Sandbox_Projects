# Runs the meetminer/ unit tests on GitHub Actions for every push and pull request that touches meetminer/.
name: meetminer tests

on:
  push:
    paths: ["meetminer/**"]
  pull_request:
    paths: ["meetminer/**"]

jobs:
  test:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: meetminer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
